# Local development stack for the Baratto-lo backend, run with Docker Desktop.
#
# Owner: Andrea Cestelli. Any edit to this file or compose.override.yaml is ad
#missible under the file-scope exception in AGENTS.md and MUST be reported in
# /docs/changelog.md so the backend maintainer is notified.
#
# The database engine is MySQL 8.0 on purpose: the backend config examples
# (.env.mamp.example, .env.windows.example), Backend/README.md and every schema
# dump in ../Context_and_DB_V2 target MySQL 8.0 / utf8mb4. Do not swap engines.

services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: barattolo
      # Dev-only credentials, matching the team's local conventions
      # (root/root in the reference dumps). Never reuse in production.
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
      # First boot on an empty data volume imports the reference dump named by
      # ../Context_and_DB_V2/LAST_DB_TO_USE.txt: the v3.1 schema (14 tables).
      # It carries no seed rows: categories and users are created at runtime.
      - ../Context_and_DB_V2/barattolo_v3_1_senza_swipe_chat_catene.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./docker
    working_dir: /app
    environment:
      APP_ENV: dev
      # Inside the compose network the database service is host "database".
      # The URL matches the team's dev credentials and the dump's schema.
      DATABASE_URL: "mysql://root:root@database:3306/barattolo?serverVersion=8.0&charset=utf8mb4"
      # Passphrase used when generate-keypair creates the local JWT keys.
      JWT_PASSPHRASE: dev-only
      # The built-in PHP server is single-threaded by default: every request
      # queues behind the previous one. Expo screens poll in the background
      # (chat, notifications), so without workers a login/registration screen
      # can wait 15-20 s and hit the frontend's 10 s timeout.
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - .:/app
      # Integration tests resolve the reference dumps at dirname(tests) i.e.
      # the repo root (TokenRedemptionMigrationTest), so the container needs
      # Context_and_DB_V2 at the path those tests compute.
      - ../Context_and_DB_V2:/Context_and_DB_V2:ro
    ports:
      # Fixed on purpose: Frontend/src/api/config.js resolves the API port
      # via EXPO_PUBLIC_API_PORT=8000, so keep 8000 on the host.
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if [ -f composer.lock ]; then
          composer install --no-interaction --no-progress
        else
          composer update --no-interaction --no-progress
        fi
        php bin/console lexik:jwt:generate-keypair --skip-if-exists
        # opcache is off in the CLI SAPI by default, which is what `php -S`
        # uses: without these flags every request recompiles the whole
        # framework from a Windows bind mount (3-5 s per request).
        # `revalidate_freq=60` keeps the mtime stat off the hot path: with the
        # default (2 s) every request re-stats every file over the mount, which
        # costs ~2 s. The cost of the choice is that a PHP file edited on the
        # host can take up to a minute to be picked up by the server.
        php -d opcache.enable_cli=1 \
            -d opcache.memory_consumption=256 \
            -d opcache.interned_strings_buffer=32 \
            -d opcache.max_accelerated_files=20000 \
            -d opcache.validate_timestamps=1 \
            -d opcache.revalidate_freq=60 \
            -S 0.0.0.0:8000 -t public

volumes:
  database_data:
