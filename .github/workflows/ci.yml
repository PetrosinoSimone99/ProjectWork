name: CI

# Parte quando qualcuno apre/aggiorna una PR verso main, a ogni push su main e a
# ogni push sul branch di lavoro del frontend: `andrea-frontend` accumulava
# commit senza che nessuno eseguisse lint, tipi e test.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, andrea-frontend]

# Least privilege: il workflow legge il repository e nient'altro (zizmor,
# excessive-permissions).
permissions:
  contents: read

# Le action della CI girano su Node 24, non su Node 20 (fuori supporto da
# aprile 2026). Le action di prima parte sono salite alle major che dichiarano
# gia' `node24`; questa variabile copre le action di terze parti che dichiarano
# ancora `node20` (`shivammathur/setup-php`), cosi' non ne resta nessuna sul
# runtime vecchio. Primo run utile: il push di questo commit.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Il token di checkout non resta in .git/config (zizmor, artipacked).
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, openssl
      - name: Install backend dependencies
        working-directory: Backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate test JWT keys
        working-directory: Backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem -pubout \
            -out config/jwt/public.pem
      - name: Verify PHP syntax
        run: |
          for f in $(find Backend/src Backend/tests Backend/migrations \
            -name "*.php"); do
            php -l "$f" || exit 1
          done
      # `phpunit.dist.xml` non si auto-scopre: la configurazione si nomina, come
      # fanno `docs/setup.md` e il gate locale.
      - name: Run backend tests
        working-directory: Backend
        run: php bin/phpunit -c phpunit.dist.xml

  # --- Frontend Expo (React/JS): lint, tipi, test, build di controllo ---
  # `Frontend/` e' su main, quindi il job gira sempre: la vecchia guardia
  # `if: hashFiles('Frontend/package.json') != ''` impediva al job di esistere,
  # perché su un runner appena avviato il workspace e' vuoto e `hashFiles` vale
  # `''` anche sullo step di checkout — il job usciva verde senza aver eseguito
  # niente.
  #
  # Gli stessi tre comandi del gate pre-push (`docs/setup.md`) più l'export
  # web: lint, `tsc --noEmit`, `jest`. Senza jest e tsc la CI non copriva il
  # comportamento — l'unica cosa in `Frontend/` che una PR può rompere senza
  # che nessuno se ne accorga.
  frontend:
    name: Frontend lint + tipi + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Stessa major di Node che gira in locale: una versione sola in casa.
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Lint
        run: npx expo lint
      # `tsc --noEmit` controlla sintassi e import soltanto: `tsconfig.json`
      # ha `allowJs` senza `checkJs`, quindi i .js/.jsx non sono tipizzati.
      - name: Tipi e import
        run: npx tsc --noEmit
      # `--ci` non scrive snapshot nuovi in silenzio.
      - name: Test
        run: npx jest --ci
      - name: Build di controllo
        run: npx expo export --platform web
