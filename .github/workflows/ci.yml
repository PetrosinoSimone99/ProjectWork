name: CI

# Parte quando qualcuno apre/aggiorna una PR verso main, e a ogni push su main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, openssl
      - name: Install backend dependencies
        working-directory: Backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate test JWT keys
        working-directory: Backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem -pubout -out config/jwt/public.pem
      - name: Verify PHP syntax
        run: |
          for f in $(find Backend/src Backend/tests Backend/migrations -name "*.php"); do
            php -l "$f" || exit 1
          done
      - name: Run backend tests
        working-directory: Backend
        run: php bin/phpunit

  # --- Frontend Expo (React/JS): lint + build di controllo ---
  # Gira solo quando Frontend/ è presente su main (cioè dopo il merge del frontend).
  # Nota: hashFiles è ammesso solo a livello di STEP, non di job, quindi la guardia
  # è su ogni step: finché il frontend non c'è, tutti si saltano e il job resta verde.
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
        if: hashFiles('Frontend/package.json') != ''
      - name: Setup Node
        uses: actions/setup-node@v4
        if: hashFiles('Frontend/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Installa dipendenze
        if: hashFiles('Frontend/package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('Frontend/package.json') != ''
        run: npx expo lint
      - name: Build di controllo
        if: hashFiles('Frontend/package.json') != ''
        run: npx expo export --platform web
